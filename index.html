<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chargely</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

<header class="header">

  <div class="header-content">

    <h1>Chargely ⚡</h1>

    <p>EV Charging Availability</p>

    <div class="status-summary">

      <span class="summary available-summary">
        🟢 <span id="availableCount">0</span> Available
      </span>

      <span class="summary charging-summary">
        🔵 <span id="chargingCount">0</span> Charging
      </span>

      <span class="summary ending-summary">
        🟡 <span id="endingSoonCount">0</span> Ending Soon
      </span>

      <span class="summary out-of-order-summary">
        🔴 <span id="outOfOrderCount">0</span> Out of Order
      </span>

    </div>

  </div>

</header>

<section class="map-container">

  <div class="map-wrapper">

<img src="assets/parking-map.png" class="parking-map">

<button class="bay-marker horizontal-bay available" style="left: 38%; top: 17%;" aria-label="Charging bay 1">1</button>
<button class="bay-marker horizontal-bay available" style="left: 42.60%; top: 17%;" aria-label="Charging bay 2">2</button>
<button class="bay-marker horizontal-bay available" style="left: 47.1%; top: 17%;" aria-label="Charging bay 3">3</button>
<button class="bay-marker horizontal-bay out-of-order" style="left: 51.8%; top: 17%;" aria-label="Charging bay 4">4</button>
<button class="bay-marker horizontal-bay available" style="left: 56.4%; top: 17%;" aria-label="Charging bay 5">5</button>
<button class="bay-marker horizontal-bay available" style="left: 61%; top: 17%;" aria-label="Charging bay 6">6</button>
<!-- Vertical charging bays -->
<button class="bay-marker vertical-bay available" style="left: 23%; top: 17.6%;" aria-label="Charging bay 7">7</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 20.9%;" aria-label="Charging bay 8">8</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 24.1%;" aria-label="Charging bay 9">9</button>
<button class="bay-marker vertical-bay out-of-order" style="left: 23%; top: 27.3%;" aria-label="Charging bay 10">10</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 30.5%;" aria-label="Charging bay 11">11</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 33.6%;" aria-label="Charging bay 12">12</button>
<button class="bay-marker vertical-bay out-of-order" style="left: 23%; top: 36.7%;" aria-label="Charging bay 13">13</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 39.8%;" aria-label="Charging bay 14">14</button>
<button class="bay-marker vertical-bay out-of-order" style="left: 23%; top: 42.9%;" aria-label="Charging bay 15">15</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 46%;" aria-label="Charging bay 16">16</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 49.2%;" aria-label="Charging bay 17">17</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 52.3%;" aria-label="Charging bay 18">18</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 55.4%;" aria-label="Charging bay 19">19</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 58.6%;" aria-label="Charging bay 20">20</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 61.8%;" aria-label="Charging bay 21">21</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 64.9%;" aria-label="Charging bay 22">22</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 68.1%;" aria-label="Charging bay 23">23</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 71.2%;" aria-label="Charging bay 24">24</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 74.3%;" aria-label="Charging bay 25">25</button>
<button class="bay-marker vertical-bay available" style="left: 23%; top: 77.4%;" aria-label="Charging bay 26">26</button>

 

    <!-- EV charging bay markers will go here -->

  </div>

</section>

<!-- Bay information panel -->
<div class="bay-modal" id="bayModal">
  <div class="bay-modal-content">

    <button class="close-modal" id="closeModal" aria-label="Close">
      ×
    </button>

    <h2 id="modalBayNumber">Bay</h2>

    <p class="modal-status" id="modalStatus">
      Available
    </p>

    <p class="modal-info" id="modalInfo"></p>

    <button class="modal-action" id="modalAction">
  Start Charging
</button>

<button class="modal-report" id="modalReport">
  Report Issue
</button>

  </div>
</div>

  </main>

  <script src="app.js"></script>

</body>
</html>
