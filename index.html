<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chargely</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <h1>Chargely ⚡</h1>
      <p>EV Charging Availability</p>
    </header>

<section class="map-container">

  <div class="map-wrapper">

    <img
      src="assets/parking-map.jpg"
      alt="EMA2 EV charging parking area"
      class="parking-map"
    >
<!-- Horizontal charging bays -->
<button class="bay-marker horizontal-bay" style="left: 58.6%; top: 14.4%;" aria-label="Charging bay 1">1</button>
<button class="bay-marker horizontal-bay" style="left: 62.8%; top: 14.3%;" aria-label="Charging bay 2">2</button>
<button class="bay-marker horizontal-bay" style="left: 67.1%; top: 15.1%;" aria-label="Charging bay 3">3</button>
<button class="bay-marker horizontal-bay" style="left: 72.6%; top: 14.8%;" aria-label="Charging bay 4">4</button>
<button class="bay-marker horizontal-bay" style="left: 76.4%; top: 14.9%;" aria-label="Charging bay 5">5</button>
<button class="bay-marker horizontal-bay" style="left: 82.2%; top: 14.5%;" aria-label="Charging bay 6">6</button>
    

    <!-- EV charging bay markers will go here -->

  </div>

</section>

  </main>

  <script src="app.js"></script>

</body>
</html>
